<!DOCTYPE html>
<html>
<head>
  <title>Editor</title>
  <script>
    // Send current content to parent for monitoring
    function sendContent() {
      window.parent.postMessage({ type: "editorContent", content: document.getElementById("editor").value }, window.origin);
    }

    // Listen for commands from parent
    window.addEventListener("message", (event) => {
      if (event.origin !== window.origin) return;
      if (event.data.type === "saveRequest") {
        alert("Saving content: " + document.getElementById("editor").value);
        // Do save logic here
      }
    });

    setInterval(sendContent, 5000); // Periodically send content for monitoring
  </script>
</head>
<body>
  <textarea id="editor" style="width:100%; height:90%;"></textarea>
</body>
</html>
